[project]
name = "mergepy"
version = "1.2.4"
authors = [
  { name="Excited Bore", email="brunt-curry-wobble@duck.com" },
]

keywords = ["mergepy", "textual", "setuptools", "development"]
description = "A cli-based python tool designed to merge 2 files together interactively (using textual and python's difflib)"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [ "argcomplete >= 3.6.3", "textual >= 3.0.20", "PySide6 >= 6.11.1", "Zenity >= 2.0.0", 'tree-sitter >= 0.25.2', 'tree-sitter-bash >= 0.25.1', 'tree-sitter-c >= 0.24.2', 'tree-sitter-c-sharp>= 0.23.5', 'tree-sitter-cpp >= 0.23.4', 'tree-sitter-css >= 0.25.0', 'tree-sitter-embedded-template >= 0.25.0', 'tree-sitter-go >= 0.25.0', 'tree-sitter-html >= 0.23.2', 'tree-sitter-java >= 0.23.2', 'tree-sitter-javascript >= 0.25.0', 'tree-sitter-json >= 0.24.8', 'tree-sitter-php >= 0.24.1', 'tree-sitter-python >= 0.25.0', 'tree-sitter-ruby >= 0.23.1', 'tree-sitter-rust >= 0.24.2', 'tree-sitter-swift >= 0.7.3', 'tree-sitter-typescript >= 0.23.2', 'tree-sitter-yaml >= 0.7.2', 'tree-sitter-zsh >= 0.63.4' ]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[build-system]
requires = ["setuptools", "argcomplete", "textual", "Zenity", 'PySide6', 'tree-sitter', 'tree-sitter-bash', 'tree-sitter-c', 'tree-sitter-c-sharp', 'tree-sitter-cpp', 'tree-sitter-css', 'tree-sitter-embedded-template', 'tree-sitter-go', 'tree-sitter-html', 'tree-sitter-java', 'tree-sitter-javascript', 'tree-sitter-json', 'tree-sitter-php', 'tree-sitter-python', 'tree-sitter-ruby', 'tree-sitter-rust', 'tree-sitter-swift', 'tree-sitter-typescript', 'tree-sitter-yaml', 'tree-sitter-zsh']
build-backend = "setuptools.build_meta"


[project.scripts]
mergepy = "mergepy:main"

[tool.setuptools]
package-dir = { "" = "src" }

[project.urls]
"Homepage" = "https://github.com/excited-bore/mergepy"
"Bug Tracker" = "https://github.com/excited-bore/mergepy/issues"

[tool.setuptools.package-data]
"mergepy" = ["*.tcss"]
